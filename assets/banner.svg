<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a6c8f"/>
      <stop offset="0.55" stop-color="#04364f"/>
      <stop offset="1" stop-color="#020b18"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="900" height="260" rx="14"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <!-- water -->
    <rect width="900" height="260" fill="url(#sea)"/>

    <!-- light rays -->
    <polygon points="120,0 190,0 330,260 190,260" fill="#ffffff" opacity="0.05">
      <animate attributeName="opacity" values="0.03;0.1;0.03" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="560,0 620,0 760,260 640,260" fill="#ffffff" opacity="0.05">
      <animate attributeName="opacity" values="0.09;0.03;0.09" dur="7s" repeatCount="indefinite"/>
    </polygon>

    <!-- back wave -->
    <path d="M0 150 q112.5 -34 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z" fill="#0a6c8f" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="14s" repeatCount="indefinite"/>
    </path>

    <!-- LEVIATHAN: drifts slowly right to left -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 182" to="-560 182" dur="45s" begin="-16s" repeatCount="indefinite"/>
      <!-- gentle vertical bobbing -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="6s" repeatCount="indefinite"/>
        <g transform="scale(0.9)" opacity="0.9">

          <!-- body (ripples by morphing between two shapes) -->
          <path fill="#021a28" stroke="#00e5ff" stroke-opacity="0.28" stroke-width="1.5" stroke-linejoin="round"
                d="M60 -24 C120 -46 190 4 255 -16 S370 -34 470 0 C380 4 330 22 255 24 S120 44 60 26 Z">
            <animate attributeName="d" dur="5s" repeatCount="indefinite"
              values="M60 -24 C120 -46 190 4 255 -16 S370 -34 470 0 C380 4 330 22 255 24 S120 44 60 26 Z;
                      M60 -24 C120 -2 190 -40 255 -12 S370 10 470 0 C380 -8 330 6 255 20 S120 6 60 26 Z;
                      M60 -24 C120 -46 190 4 255 -16 S370 -34 470 0 C380 4 330 22 255 24 S120 44 60 26 Z"/>
          </path>

          <!-- belly glow spots -->
          <g fill="#00e5ff">
            <circle cx="70" cy="16" r="2.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
            <circle cx="92" cy="20" r="2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
            <circle cx="114" cy="22" r="2.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
          </g>

          <!-- spiked crest -->
          <path fill="#021a28" stroke="#00e5ff" stroke-opacity="0.28" stroke-width="1.5" stroke-linejoin="round"
                d="M18 -26 L26 -50 L40 -28 L52 -58 L66 -28 L80 -50 L90 -30 Z"/>

          <!-- head -->
          <path fill="#021a28" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"
                d="M62 -24 C30 -32 0 -28 -44 -10 L-58 0 L-44 8 C0 24 30 32 62 26 Z"/>

          <!-- lower jaw -->
          <path fill="#01131f" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.5" stroke-linejoin="round"
                d="M-40 8 C-10 22 20 34 56 32 C20 40 -20 34 -46 16 Z"/>

          <!-- teeth -->
          <g fill="#9fdcef" opacity="0.85">
            <path d="M-42 6 L-38 16 L-33 8 Z"/>
            <path d="M-30 9 L-26 19 L-21 10 Z"/>
            <path d="M-17 12 L-13 22 L-8 13 Z"/>
            <path d="M-4 14 L0 24 L5 15 Z"/>
          </g>

          <!-- eyes -->
          <g filter="url(#eyeglow)">
            <circle cx="-8" cy="-11" r="5" fill="#00e5ff">
              <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="-8" cy="-11" r="1.8" fill="#020b18"/>
            <circle cx="18" cy="-14" r="3.5" fill="#00e5ff">
              <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
            </circle>
          </g>
        </g>
      </g>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#9fdcef" stroke-width="1.2">
      <circle cx="120" cy="250" r="4">
        <animate attributeName="cy" from="260" to="-10" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="250" r="3">
        <animate attributeName="cy" from="260" to="-10" dur="7s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="-3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="250" r="5">
        <animate attributeName="cy" from="260" to="-10" dur="11s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="250" r="3.5">
        <animate attributeName="cy" from="260" to="-10" dur="8s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="-1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name -->
    <g filter="url(#glow)">
      <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="3" fill="#00e5ff">
        LEVIS NGANGA
        <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
      </text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <text x="450" y="155" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#9fdcef">
      DIVING DEEP INTO CODE
    </text>

    <!-- middle wave -->
    <path d="M0 175 q112.5 -30 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z" fill="#0a6c8f" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- front wave -->
    <path d="M0 200 q112.5 -26 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z" fill="#020b18" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
