<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5a70"/>
      <stop offset="0.5" stop-color="#07384a"/>
      <stop offset="1" stop-color="#031621"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="900" height="260" rx="14"/>
    </clipPath>
    <radialGradient id="amber">
      <stop offset="0" stop-color="#ffc062" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#d98a2b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d98a2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanspot">
      <stop offset="0" stop-color="#3de0d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3de0d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lure">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#ffe9a0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="fish">
      <path d="M0 0 C 10 -11, 28 -11, 38 0 C 28 11, 10 11, 0 0 Z"/>
      <path d="M2 0 L -13 -9 L -13 9 Z"/>
      <circle cx="30" cy="-2.5" r="2" fill="#031621"/>
    </g>
  </defs>

  <g clip-path="url(#round)">
    <!-- water -->
    <rect width="900" height="260" fill="url(#sea)"/>

    <!-- diagonal light rays -->
    <polygon points="90,0 150,0 330,260 220,260" fill="#9fe8ff" opacity="0.06">
      <animate attributeName="opacity" values="0.03;0.1;0.03" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="380,0 430,0 600,260 500,260" fill="#9fe8ff" opacity="0.06">
      <animate attributeName="opacity" values="0.09;0.03;0.09" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="650,0 690,0 860,260 780,260" fill="#9fe8ff" opacity="0.05">
      <animate attributeName="opacity" values="0.04;0.09;0.04" dur="6s" repeatCount="indefinite"/>
    </polygon>

    <!-- floating particles (marine snow) -->
    <g fill="#bff3ff">
      <circle cx="60" cy="20" r="1.4" opacity="0.5"><animate attributeName="cy" from="-10" to="270" dur="22s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="40" r="1" opacity="0.4"><animate attributeName="cy" from="-10" to="270" dur="17s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="10" r="1.6" opacity="0.5"><animate attributeName="cy" from="-10" to="270" dur="26s" begin="-12s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="60" r="1.2" opacity="0.4"><animate attributeName="cy" from="-10" to="270" dur="19s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="25" r="1.5" opacity="0.5"><animate attributeName="cy" from="-10" to="270" dur="24s" begin="-15s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="50" r="1" opacity="0.4"><animate attributeName="cy" from="-10" to="270" dur="20s" begin="-9s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="15" r="1.3" opacity="0.5"><animate attributeName="cy" from="-10" to="270" dur="23s" begin="-18s" repeatCount="indefinite"/></circle>
    </g>

    <!-- JELLYFISH 1 (big, right) -->
    <g transform="translate(760,95)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -12 -22; 0 0" dur="9s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 0.9; 1 1" dur="3.2s" repeatCount="indefinite"/>
          <path d="M-26 0 C -26 -36, 26 -36, 26 0 C 14 6, -14 6, -26 0 Z" fill="#7df9ff" fill-opacity="0.14" stroke="#9fdcef" stroke-opacity="0.45" stroke-width="1.2"/>
          <path d="M-14 -22 C -6 -30, 6 -30, 14 -22" fill="none" stroke="#bff3ff" stroke-opacity="0.35" stroke-width="1.2"/>
        </g>
        <g stroke="#9fdcef" stroke-opacity="0.4" stroke-width="1.3" fill="none" stroke-linecap="round">
          <path d="M-16 4 q-5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="-4 -16 4; 4 -16 4; -4 -16 4" dur="4s" repeatCount="indefinite"/>
          </path>
          <path d="M-6 5 q5 16 0 32 t0 30">
            <animateTransform attributeName="transform" type="rotate" values="4 -6 5; -4 -6 5; 4 -6 5" dur="3.6s" repeatCount="indefinite"/>
          </path>
          <path d="M6 5 q-5 16 0 32 t0 30">
            <animateTransform attributeName="transform" type="rotate" values="-4 6 5; 4 6 5; -4 6 5" dur="4.2s" repeatCount="indefinite"/>
          </path>
          <path d="M16 4 q5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="4 16 4; -4 16 4; 4 16 4" dur="3.8s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>

    <!-- JELLYFISH 2 (small, middle) -->
    <g transform="translate(560,70) scale(0.6)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 14 -20; 0 0" dur="11s" begin="-4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 0.9; 1 1" dur="3.6s" begin="-1s" repeatCount="indefinite"/>
          <path d="M-26 0 C -26 -36, 26 -36, 26 0 C 14 6, -14 6, -26 0 Z" fill="#7df9ff" fill-opacity="0.14" stroke="#9fdcef" stroke-opacity="0.45" stroke-width="1.6"/>
        </g>
        <g stroke="#9fdcef" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round">
          <path d="M-12 4 q-5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="-5 -12 4; 5 -12 4; -5 -12 4" dur="4s" repeatCount="indefinite"/>
          </path>
          <path d="M0 5 q5 16 0 32 t0 30">
            <animateTransform attributeName="transform" type="rotate" values="5 0 5; -5 0 5; 5 0 5" dur="3.5s" repeatCount="indefinite"/>
          </path>
          <path d="M12 4 q-5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="-5 12 4; 5 12 4; -5 12 4" dur="4.4s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>

    <!-- LEVIATHAN: swims left to right, head leads -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-90 190" to="1400 190" dur="55s" begin="-20s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1.4 0 0; 1.4 0 0; -1.4 0 0" dur="6s" repeatCount="indefinite"/>
        <g transform="scale(0.8)">

          <!-- dorsal spikes -->
          <g fill="#04151f">
            <polygon points="-54,-25 -38,-57 -26,-25"/>
            <polygon points="-99,-26 -83,-62 -71,-26"/>
            <polygon points="-144,-25 -128,-59 -116,-25"/>
            <polygon points="-189,-23 -173,-59 -161,-23"/>
            <polygon points="-234,-20 -218,-52 -206,-20"/>
            <polygon points="-279,-18 -263,-52 -251,-18"/>
            <polygon points="-324,-16 -308,-46 -296,-16"/>
            <polygon points="-369,-17 -353,-43 -341,-17"/>
            <polygon points="-414,-20 -398,-44 -386,-20"/>
            <polygon points="-464,-21 -448,-43 -436,-21"/>
            <polygon points="-514,-14 -498,-34 -486,-14"/>
            <polygon points="-564,-4 -548,-20 -536,-4"/>
          </g>

          <!-- body and head -->
          <path fill="#04151f" stroke="#2fd6e6" stroke-opacity="0.14" stroke-width="1.5" stroke-linejoin="round"
                d="M-640 8 C -540 -6 -440 -28 -330 -22 S -120 -36 0 -30 C 40 -32 80 -20 112 0 C 80 14 44 26 0 26 C -80 30 -200 40 -300 32 S -540 20 -640 8 Z"/>

          <!-- mouth line and teeth -->
          <path d="M112 0 C 80 8 50 12 22 10" fill="none" stroke="#2fd6e6" stroke-opacity="0.3" stroke-width="1.2"/>
          <g fill="#aee9f2" opacity="0.85">
            <polygon points="100,3 96,12 92,5"/>
            <polygon points="88,6 84,15 80,8"/>
            <polygon points="76,8 72,17 68,10"/>
            <polygon points="64,10 60,19 56,12"/>
            <polygon points="52,11 48,20 44,13"/>
            <polygon points="40,11 36,20 32,13"/>
          </g>

          <!-- amber eye -->
          <circle cx="52" cy="-12" r="16" fill="url(#amber)">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="52" cy="-12" r="3" fill="#ffd28a"/>

          <!-- glowing cyan spots along the body -->
          <circle cx="-150" cy="4" r="14" fill="url(#cyanspot)">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="-260" cy="6" r="12" fill="url(#cyanspot)">
            <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="-370" cy="4" r="11" fill="url(#cyanspot)">
            <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="-470" cy="2" r="9" fill="url(#cyanspot)">
            <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.4s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>

    <!-- ANGLERFISH: swims left, lure glows -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 188" to="-120 188" dur="42s" begin="-10s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5s" repeatCount="indefinite"/>
        <g transform="scale(0.8)">
          <!-- body -->
          <path fill="#03121b" stroke="#2fd6e6" stroke-opacity="0.15" stroke-width="1.2"
                d="M-40 0 C -40 -28, 10 -36, 40 -16 L 74 -32 L 74 32 L 40 16 C 10 36, -40 28, -40 0 Z"/>
          <!-- eye -->
          <circle cx="-22" cy="-6" r="4.5" fill="#d9f6ff"/>
          <circle cx="-23" cy="-6" r="1.8" fill="#03121b"/>
          <!-- teeth -->
          <g fill="#aee9f2" opacity="0.9">
            <polygon points="-38,6 -35,16 -31,7"/>
            <polygon points="-30,9 -27,19 -23,10"/>
            <polygon points="-22,12 -19,22 -15,13"/>
            <polygon points="-14,14 -11,24 -7,15"/>
          </g>
          <!-- lure stalk and bulb -->
          <path d="M-6 -27 C -8 -62, -38 -66, -56 -50" fill="none" stroke="#03121b" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-56" cy="-50" r="16" fill="url(#lure)">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="-56" cy="-50" r="3.5" fill="#fff6cf"/>
        </g>
      </g>
    </g>

    <!-- FISH swimming right -->
    <g transform="translate(0,52)">
      <g fill="#3fb6c4" opacity="0.75">
        <animateMotion dur="17s" repeatCount="indefinite" path="M -60 0 C 250 -22, 600 22, 960 0"/>
        <use xlink:href="#fish"/>
      </g>
    </g>
    <g transform="translate(0,150)">
      <g fill="#6fd8d0" opacity="0.7">
        <animateMotion dur="25s" begin="-11s" repeatCount="indefinite" path="M -60 0 C 250 -22, 600 22, 960 0"/>
        <g transform="scale(1.3)"><use xlink:href="#fish"/></g>
      </g>
    </g>

    <!-- FISH swimming left -->
    <g transform="translate(0,125)">
      <g fill="#ff8a65" opacity="0.8">
        <animateMotion dur="21s" begin="-6s" repeatCount="indefinite" path="M 960 0 C 600 -22, 250 22, -60 0"/>
        <g transform="scale(-0.8,0.8)"><use xlink:href="#fish"/></g>
      </g>
    </g>
    <g transform="translate(0,35)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="29s" begin="-14s" repeatCount="indefinite" path="M 960 0 C 600 -18, 250 18, -60 0"/>
        <g transform="scale(-1,1)"><use xlink:href="#fish"/></g>
      </g>
    </g>

    <!-- small school -->
    <g transform="translate(0,95)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="14s" begin="-2s" repeatCount="indefinite" path="M -60 0 C 250 -14, 600 14, 960 0"/>
        <g transform="scale(0.45)"><use xlink:href="#fish"/></g>
      </g>
    </g>
    <g transform="translate(0,106)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="14s" begin="-3s" repeatCount="indefinite" path="M -60 0 C 250 -14, 600 14, 960 0"/>
        <g transform="scale(0.45)"><use xlink:href="#fish"/></g>
      </g>
    </g>
    <g transform="translate(0,86)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="14s" begin="-4s" repeatCount="indefinite" path="M -60 0 C 250 -14, 600 14, 960 0"/>
        <g transform="scale(0.45)"><use xlink:href="#fish"/></g>
      </g>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#bff3ff" stroke-width="1.1">
      <circle cx="120" cy="250" r="3.5">
        <animate attributeName="cy" from="260" to="-10" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="250" r="2.5">
        <animate attributeName="cy" from="260" to="-10" dur="7s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="-3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="670" cy="250" r="4.5">
        <animate attributeName="cy" from="260" to="-10" dur="11s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="850" cy="250" r="3">
        <animate attributeName="cy" from="260" to="-10" dur="8s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="-1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- TEXT (same layout as the portfolio hero) -->
    <text x="40" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#d7f5f7">Hello, I'm</text>
    <text x="40" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#d7f5f7" filter="url(#glow)">Levis Nganga.</text>
    <text x="42" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d7f5f7" textLength="262">A Software Engineer</text>
    <rect x="312" y="138" width="3" height="22" fill="#3de0d0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- depth gauge, like the portfolio -->
    <text x="870" y="32" text-anchor="end" font-family="'Courier New', monospace" font-size="15" fill="#d7f5f7">0 m</text>
    <text x="870" y="48" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#9fdcef">Sunlight zone</text>

    <!-- waves at the bottom -->
    <path d="M0 222 q112.5 -22 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z" fill="#0a6c8f" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 238 q112.5 -18 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V260 H0 Z" fill="#020b18" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
