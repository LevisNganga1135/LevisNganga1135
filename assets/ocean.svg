<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5a70"/>
      <stop offset="0.5" stop-color="#07384a"/>
      <stop offset="1" stop-color="#031621"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="900" height="220" rx="14"/>
    </clipPath>
    <radialGradient id="lure">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#ffe9a0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <g id="fish">
      <path d="M0 0 C 10 -11, 28 -11, 38 0 C 28 11, 10 11, 0 0 Z"/>
      <path d="M2 0 L -13 -9 L -13 9 Z"/>
      <circle cx="30" cy="-2.5" r="2" fill="#031621"/>
    </g>
  </defs>

  <g clip-path="url(#round)">
    <!-- water -->
    <rect width="900" height="220" fill="url(#sea)"/>

    <!-- diagonal light rays -->
    <polygon points="90,0 150,0 320,220 210,220" fill="#9fe8ff" opacity="0.06">
      <animate attributeName="opacity" values="0.03;0.1;0.03" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="400,0 450,0 610,220 510,220" fill="#9fe8ff" opacity="0.06">
      <animate attributeName="opacity" values="0.09;0.03;0.09" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="660,0 700,0 860,220 780,220" fill="#9fe8ff" opacity="0.05">
      <animate attributeName="opacity" values="0.04;0.09;0.04" dur="6s" repeatCount="indefinite"/>
    </polygon>

    <!-- floating particles -->
    <g fill="#bff3ff">
      <circle cx="70" cy="20" r="1.4" opacity="0.5"><animate attributeName="cy" from="-10" to="230" dur="22s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="40" r="1" opacity="0.4"><animate attributeName="cy" from="-10" to="230" dur="17s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="10" r="1.6" opacity="0.5"><animate attributeName="cy" from="-10" to="230" dur="26s" begin="-12s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="60" r="1.2" opacity="0.4"><animate attributeName="cy" from="-10" to="230" dur="19s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="25" r="1.5" opacity="0.5"><animate attributeName="cy" from="-10" to="230" dur="24s" begin="-15s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="50" r="1" opacity="0.4"><animate attributeName="cy" from="-10" to="230" dur="20s" begin="-9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sonar pulse -->
    <g fill="none" stroke="#3de0d0" stroke-width="2">
      <circle cx="70" cy="110" r="5">
        <animate attributeName="r" from="5" to="120" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="110" r="5">
        <animate attributeName="r" from="5" to="120" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="110" r="5">
        <animate attributeName="r" from="5" to="120" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="70" cy="110" r="4" fill="#3de0d0"/>

    <!-- status text -->
    <text x="24" y="32" font-family="'Courier New', monospace" font-size="14" fill="#3de0d0">
      &#9679; SONAR ACTIVE · scanning the deep...
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </text>

    <!-- JELLYFISH (big) -->
    <g transform="translate(780,85)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -12 -22; 0 0" dur="9s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 0.9; 1 1" dur="3.2s" repeatCount="indefinite"/>
          <path d="M-26 0 C -26 -36, 26 -36, 26 0 C 14 6, -14 6, -26 0 Z" fill="#7df9ff" fill-opacity="0.14" stroke="#9fdcef" stroke-opacity="0.45" stroke-width="1.2"/>
          <path d="M-14 -22 C -6 -30, 6 -30, 14 -22" fill="none" stroke="#bff3ff" stroke-opacity="0.35" stroke-width="1.2"/>
        </g>
        <g stroke="#9fdcef" stroke-opacity="0.4" stroke-width="1.3" fill="none" stroke-linecap="round">
          <path d="M-16 4 q-5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="-4 -16 4; 4 -16 4; -4 -16 4" dur="4s" repeatCount="indefinite"/>
          </path>
          <path d="M-6 5 q5 16 0 32 t0 30">
            <animateTransform attributeName="transform" type="rotate" values="4 -6 5; -4 -6 5; 4 -6 5" dur="3.6s" repeatCount="indefinite"/>
          </path>
          <path d="M6 5 q-5 16 0 32 t0 30">
            <animateTransform attributeName="transform" type="rotate" values="-4 6 5; 4 6 5; -4 6 5" dur="4.2s" repeatCount="indefinite"/>
          </path>
          <path d="M16 4 q5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="4 16 4; -4 16 4; 4 16 4" dur="3.8s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>

    <!-- JELLYFISH (small) -->
    <g transform="translate(560,75) scale(0.6)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 14 -20; 0 0" dur="11s" begin="-4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 0.9; 1 1" dur="3.6s" begin="-1s" repeatCount="indefinite"/>
          <path d="M-26 0 C -26 -36, 26 -36, 26 0 C 14 6, -14 6, -26 0 Z" fill="#7df9ff" fill-opacity="0.14" stroke="#9fdcef" stroke-opacity="0.45" stroke-width="1.6"/>
        </g>
        <g stroke="#9fdcef" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round">
          <path d="M-12 4 q-5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="-5 -12 4; 5 -12 4; -5 -12 4" dur="4s" repeatCount="indefinite"/>
          </path>
          <path d="M0 5 q5 16 0 32 t0 30">
            <animateTransform attributeName="transform" type="rotate" values="5 0 5; -5 0 5; 5 0 5" dur="3.5s" repeatCount="indefinite"/>
          </path>
          <path d="M12 4 q-5 14 0 28 t0 28">
            <animateTransform attributeName="transform" type="rotate" values="-5 12 4; 5 12 4; -5 12 4" dur="4.4s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>

    <!-- ANGLERFISH -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 150" to="-120 150" dur="42s" begin="-14s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5s" repeatCount="indefinite"/>
        <g transform="scale(0.75)">
          <path fill="#03121b" stroke="#2fd6e6" stroke-opacity="0.15" stroke-width="1.2"
                d="M-40 0 C -40 -28, 10 -36, 40 -16 L 74 -32 L 74 32 L 40 16 C 10 36, -40 28, -40 0 Z"/>
          <circle cx="-22" cy="-6" r="4.5" fill="#d9f6ff"/>
          <circle cx="-23" cy="-6" r="1.8" fill="#03121b"/>
          <g fill="#aee9f2" opacity="0.9">
            <polygon points="-38,6 -35,16 -31,7"/>
            <polygon points="-30,9 -27,19 -23,10"/>
            <polygon points="-22,12 -19,22 -15,13"/>
            <polygon points="-14,14 -11,24 -7,15"/>
          </g>
          <path d="M-6 -27 C -8 -62, -38 -66, -56 -50" fill="none" stroke="#03121b" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-56" cy="-50" r="16" fill="url(#lure)">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="-56" cy="-50" r="3.5" fill="#fff6cf"/>
        </g>
      </g>
    </g>

    <!-- FISH swimming right -->
    <g transform="translate(0,52)">
      <g fill="#3fb6c4" opacity="0.75">
        <animateMotion dur="17s" repeatCount="indefinite" path="M -60 0 C 250 -22, 600 22, 960 0"/>
        <use xlink:href="#fish"/>
      </g>
    </g>
    <g transform="translate(0,160)">
      <g fill="#6fd8d0" opacity="0.7">
        <animateMotion dur="25s" begin="-11s" repeatCount="indefinite" path="M -60 0 C 250 -22, 600 22, 960 0"/>
        <g transform="scale(1.3)"><use xlink:href="#fish"/></g>
      </g>
    </g>

    <!-- FISH swimming left -->
    <g transform="translate(0,125)">
      <g fill="#ff8a65" opacity="0.8">
        <animateMotion dur="21s" begin="-6s" repeatCount="indefinite" path="M 960 0 C 600 -22, 250 22, -60 0"/>
        <g transform="scale(-0.8,0.8)"><use xlink:href="#fish"/></g>
      </g>
    </g>
    <g transform="translate(0,38)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="29s" begin="-14s" repeatCount="indefinite" path="M 960 0 C 600 -18, 250 18, -60 0"/>
        <g transform="scale(-1,1)"><use xlink:href="#fish"/></g>
      </g>
    </g>

    <!-- small school -->
    <g transform="translate(0,92)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="14s" begin="-2s" repeatCount="indefinite" path="M -60 0 C 250 -14, 600 14, 960 0"/>
        <g transform="scale(0.45)"><use xlink:href="#fish"/></g>
      </g>
    </g>
    <g transform="translate(0,103)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="14s" begin="-3s" repeatCount="indefinite" path="M -60 0 C 250 -14, 600 14, 960 0"/>
        <g transform="scale(0.45)"><use xlink:href="#fish"/></g>
      </g>
    </g>
    <g transform="translate(0,83)">
      <g fill="#9fdcef" opacity="0.7">
        <animateMotion dur="14s" begin="-4s" repeatCount="indefinite" path="M -60 0 C 250 -14, 600 14, 960 0"/>
        <g transform="scale(0.45)"><use xlink:href="#fish"/></g>
      </g>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#bff3ff" stroke-width="1.1">
      <circle cx="240" cy="210" r="3.5">
        <animate attributeName="cy" from="215" to="-10" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="210" r="2.5">
        <animate attributeName="cy" from="215" to="-10" dur="7s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="-3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="210" r="4.5">
        <animate attributeName="cy" from="215" to="-10" dur="11s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="210" r="3">
        <animate attributeName="cy" from="215" to="-10" dur="8s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="-1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="210" r="4">
        <animate attributeName="cy" from="215" to="-10" dur="10s" begin="-6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="-6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- seabed + seaweed -->
    <path d="M0 220 L0 205 Q150 192 300 206 T600 204 T900 208 L900 220 Z" fill="#020b18"/>
    <g stroke="#0fb5a0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <g transform="translate(140,210)">
        <path d="M0 0 C -8 -18, 8 -34, 0 -52">
          <animateTransform attributeName="transform" type="rotate" values="-6 0 0; 6 0 0; -6 0 0" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(155,212)">
        <path d="M0 0 C 8 -14, -8 -28, 0 -40">
          <animateTransform attributeName="transform" type="rotate" values="6 0 0; -6 0 0; 6 0 0" dur="3.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(690,210)">
        <path d="M0 0 C -8 -18, 8 -34, 0 -56">
          <animateTransform attributeName="transform" type="rotate" values="-7 0 0; 7 0 0; -7 0 0" dur="4.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(706,212)">
        <path d="M0 0 C 8 -14, -8 -28, 0 -42">
          <animateTransform attributeName="transform" type="rotate" values="7 0 0; -7 0 0; 7 0 0" dur="3.8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
